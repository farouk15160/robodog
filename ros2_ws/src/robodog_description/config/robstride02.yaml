# =============================================================================
# ROBSTRIDE02 (RS02) QDD actuator specification
# =============================================================================
# Single source of truth for actuator data. Consumed by:
#   - robodog_description  : URDF joint effort/velocity limits, actuator visuals
#   - robodog_hardware     : CAN protocol scaling, backend limits, thermal model
#   - robodog_control      : safety monitor limits, torque->current conversion
#   - robodog_sim          : MuJoCo actuator gains, armature, damping, frictionloss
#
# Values marked  [SPEC]      come from the manufacturer datasheet.
# Values marked  [DERIVED]   are computed from [SPEC] values (formula given).
# Values marked  [ESTIMATE]  are engineering estimates that MUST be identified
#                            on real hardware before closing the loop at speed.
# -----------------------------------------------------------------------------
model: ROBSTRIDE02
revision: "2026-06 selection table + RS02 manual"

mechanical:
  mass_kg: 0.380                 # [SPEC] 380 g +/- 3 g
  mass_tolerance_kg: 0.003       # [SPEC]
  diameter_m: 0.0785             # [SPEC] 78.5 mm
  body_depth_m: 0.0415           # [SPEC] 41.5 mm
  gear_ratio: 7.75               # [SPEC] 7.75:1 planetary, machined steel
  gear_material: machined_steel  # [SPEC]
  # Rotor inertia is not published. Estimated for a 28-pole outrunner rotor of
  # ~80 g at ~30 mm mean radius:  J = m*r^2 = 0.08 * 0.030^2 = 7.2e-5.
  rotor_inertia_kgm2: 8.0e-5     # [ESTIMATE] identify via free-spin decel test
  # Reflected to the output shaft: J_out = J_rotor * N^2 = 8.0e-5 * 7.75^2
  reflected_inertia_kgm2: 4.805e-3   # [DERIVED] dominates distal link inertia

electrical:
  rated_voltage_v: 48.0          # [SPEC]
  voltage_min_v: 24.0            # [SPEC]
  voltage_max_v: 60.0            # [SPEC]
  motor_poles: 28                # [SPEC]
  phases: 3                      # [SPEC]
  drive: FOC                     # [SPEC]
  # Kt is OUTPUT-REFERRED (verified: 6.0 N.m / 1.22 = 4.92 Arms = 7 A peak/sqrt2)
  torque_constant_nm_per_arms: 1.22   # [SPEC]
  line_resistance_ohm: 0.58      # [SPEC] phase-to-phase
  phase_resistance_ohm: 0.29     # [DERIVED] R_line / 2 (wye)
  inductance_uh_min: 187         # [SPEC]
  inductance_uh_max: 339         # [SPEC]
  back_emf_vrms_per_krpm: 9.6    # [SPEC] +/- 10%
  no_load_current_arms: 0.5      # [SPEC]
  rated_phase_current_a_peak: 7.0    # [SPEC] +/- 10%
  peak_phase_current_a_peak: 23.0    # [SPEC] +/- 10%
  rated_phase_current_arms: 4.950    # [DERIVED] 7.0 / sqrt(2)
  peak_phase_current_arms: 16.263    # [DERIVED] 23.0 / sqrt(2)

performance:
  rated_torque_nm: 6.0           # [SPEC] RS02 manual
  selection_table_torque_nm: 7.0 # [SPEC] 2026 selection table, 7 N.m @ 100 rpm
  peak_torque_nm: 17.0           # [SPEC]
  rated_speed_rpm: 100.0         # [SPEC]
  rated_speed_rad_s: 10.472      # [DERIVED] 100 * 2*pi / 60
  no_load_speed_rpm: 410.0       # [SPEC] +/- 10%
  no_load_speed_rad_s: 42.935    # [DERIVED] 410 * 2*pi / 60
  # Duration the actuator may sit above rated torque before the I2t integrator
  # in robodog_control/safety_monitor trips. Conservative until characterised.
  peak_torque_duration_s: 2.0    # [ESTIMATE]

sensing:
  encoder_count: 2               # [SPEC] rotor-side + output-side magnetic absolute
  encoder_type: magnetic_absolute
  encoder_bits: 14               # [SPEC]
  encoder_counts_per_rev: 16384  # [SPEC] 2^14
  # Output-side encoder quantisation
  output_resolution_rad: 3.8350e-4   # [DERIVED] 2*pi / 16384
  # Rotor-side encoder referred to the output shaft (through the 7.75:1 gearbox)
  rotor_resolution_rad: 4.9484e-5    # [DERIVED] 2*pi / (16384 * 7.75)

environment:
  ambient_temp_min_c: -20.0      # [SPEC]
  ambient_temp_max_c: 50.0       # [SPEC]
  humidity_min_pct: 5.0          # [SPEC]
  humidity_max_pct: 85.0         # [SPEC] non-condensing

# First-order lumped thermal model used by the simulation backend to synthesise
# a plausible motor temperature, and by the safety monitor as the I2t reference.
#   P_cu   = 3 * I_rms^2 * R_phase          (copper loss only)
#   dT/dt  = (P_cu - (T - T_amb)/R_th) / C_th
# Calibrated so that continuous rated torque settles at ~80 C from 20 C ambient.
thermal:                          # [ESTIMATE] calibrate against RS02 telemetry
  thermal_resistance_k_per_w: 2.84   # 60 K rise / 21.1 W at rated torque
  thermal_capacitance_j_per_k: 190.0 # 0.38 kg * ~500 J/(kg.K) mixed Al/Cu/steel
  time_constant_s: 539.6             # [DERIVED] R_th * C_th
  ambient_temp_c: 20.0

# -----------------------------------------------------------------------------
# CAN interface (extended 29-bit identifiers, classic CAN 2.0B)
# -----------------------------------------------------------------------------
# IMPORTANT: the RobStride/CyberGear-family frame layout below matches the RS02
# manual this project was specified against. Protocol details are firmware
# dependent -- re-verify against the firmware revision on the delivered units
# before the first powered run. All of it is isolated in
# robodog_hardware/protocol/robstride02.py so a revision only touches one file.
can:
  bitrate_bps: 1000000           # [SPEC] 1 Mbps
  id_bits: 29                    # extended frame
  frame_dlc: 8
  # 29-bit ID layout:  [28:24] comm type | [23:8] data/host id | [7:0] target id
  id_layout:
    comm_type_shift: 24
    comm_type_mask: 0x1F
    data_shift: 8
    data_mask: 0xFFFF
    target_mask: 0xFF
  comm_types:
    get_device_id: 0
    motion_control: 1            # MIT-style impedance command
    feedback: 2                  # position/velocity/torque/temperature report
    enable: 3
    stop: 4
    set_mechanical_zero: 6
    set_can_id: 7
    read_param: 17               # 0x11
    write_param: 18              # 0x12
    fault_feedback: 21           # 0x15
  # 16-bit linear scaling used by the motion-control and feedback frames.
  scaling:
    position_min_rad: -12.566     # -4*pi
    position_max_rad:  12.566     #  4*pi
    velocity_min_rad_s: -44.0
    velocity_max_rad_s:  44.0
    torque_min_nm: -17.0
    torque_max_nm:  17.0
    kp_min: 0.0
    kp_max: 500.0
    kd_min: 0.0
    kd_max: 5.0
    # Feedback temperature is reported in 0.1 degC increments
    temperature_scale_c: 0.1
  # ---- bus budget -----------------------------------------------------------
  # An extended-ID CAN 2.0B frame with 8 data bytes is 131 bits nominal and up
  # to 159 bits with worst-case stuffing; 150 bits is the design figure.
  # Each joint needs 1 command + 1 feedback frame per cycle:
  #
  #   buses  motors/bus   rate     per bus     load
  #     1        12       250 Hz   900 kbit/s   90%   too tight, no margin
  #     1        12       400 Hz  1440 kbit/s  144%   impossible
  #     2         6       400 Hz   720 kbit/s   72%   <-- DEFAULT
  #     2         6       500 Hz   900 kbit/s   90%   rejected, no margin
  #     3         4       500 Hz   600 kbit/s   60%   upgrade path
  #
  # 400 Hz is not a compromise on control quality: the RS02 closes its
  # position/velocity loop in firmware, so the host rate is a SETPOINT UPDATE
  # rate, not a servo rate. The same 400 Hz is used in simulation so that gains
  # tuned in MuJoCo transfer without a rate change.
  # robodog_hardware/backends/robstride_can.py refuses a combination over 80%.
  bits_per_frame_design: 150
  max_bus_load_fraction: 0.80
  recommended_bus_count: 2
  recommended_control_rate_hz: 400

# -----------------------------------------------------------------------------
# Joint-level dynamics used by the URDF and the MuJoCo model.
# -----------------------------------------------------------------------------
joint_dynamics:                   # [ESTIMATE] identify from a swing-down test
  damping_nms_per_rad: 0.05       # viscous, output-referred
  coulomb_friction_nm: 0.12       # breakaway friction of the 7.75:1 steel stage
  armature_kgm2: 4.805e-3         # = mechanical.reflected_inertia_kgm2
  # The reflected rotor inertia (4.8e-3) is LARGER than the calf's own inertia
  # about the knee (~1.3e-3). Omitting `armature` in MuJoCo would therefore make
  # the simulated legs roughly 4x too easy to accelerate -- it is not optional.

# -----------------------------------------------------------------------------
# Operational (soft) limits enforced by robodog_control/safety_monitor.
# The URDF carries the HARDWARE maxima; these are the tighter values the robot
# is actually allowed to use. Two-tier limits, see docs section "Safety".
# -----------------------------------------------------------------------------
operational_limits:
  continuous_torque_nm: 6.0       # = performance.rated_torque_nm
  peak_torque_nm: 17.0            # allowed for peak_torque_duration_s
  velocity_rad_s: 20.0            # well inside the 42.9 rad/s no-load speed
  position_margin_rad: 0.05       # soft limit inset from the URDF joint limit
  temperature_warn_c: 70.0        # [ESTIMATE] derate above this
  temperature_derate_c: 85.0      # [ESTIMATE] scale torque down linearly
  temperature_fault_c: 100.0      # [ESTIMATE] latch a fault, disable output

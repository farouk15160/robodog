# September17 product specification pp31-33 supersedes July performance data.
# https://github.com/RobStride/Product_Information/blob/main/%E7%81%B5%E8%B6%B3%E6%97%B6%E4%BB%A3RS%E7%B3%BB%E5%88%97%E4%BA%A7%E5%93%81%E8%A7%84%E6%A0%BC%E4%BB%8B%E7%BB%8D%282026.09.17%29.pdf
# SHA256:76c85c3c11f15bf3adc1676d6a4b8c931ffd9c18cec41221f8ea5a8b54e22ea1
# July RS06 manual remains the CAN/dimensional source (pp8,42,57-58):
# https://github.com/RobStride/Product_Information/blob/main/Product%20Literature/RS06/RS06User%20Manual260713.pdf
# Retrieved2026-09-28; source comparison in docs/rs06_datasheet_audit.md.
# All torque/speed/electrical quantities here refer to the actuator OUTPUT
# before the external knee belt. The internal gearbox is already included.
model: ROBSTRIDE06
revision: "RS series product specification 2026-09-17; RS06 CAN manual 260713"
mechanical:
  mass_kg: 0.621
  mass_tolerance_kg: 0.003
  diameter_m: 0.088             # outer flange envelope; main can diameter 70mm
  body_depth_m: 0.049          # total axial envelope, not flange depth (33mm)
  gear_ratio: 9.0
  reflected_inertia_kgm2: 0.012 # SPEC p31: output-side equivalent inertia, not bare rotor inertia
electrical:
  rated_voltage_v: 48.0
  supply_voltage_v: 44.4      # ASSUMPTION: two6S Li-ion packs in series; 50.4V full
  voltage_min_v: 15.0
  voltage_max_v: 60.0
  torque_constant_nm_per_arms: 1.1 # SPEC p31, output-referred
  phase_resistance_ohm: 0.115 # INFERENCE: equivalent-wye R_phase=R_line/2; wiring not specified
  line_resistance_ohm: 0.23   # SPEC p31, +/-10%; not a local measurement
  resistance_tolerance_fraction: 0.10
  phase_resistance_basis: "Equivalent-wye inference from manufacturer line resistance; actual winding connection unspecified"
  inductance_mh: 0.165       # SPEC p31, +/-10%
  rated_phase_current_a_peak: 14.3
  peak_phase_current_a_peak: 57.0
  rated_phase_current_arms: 10.1116 # DERIVED:14.3Apk/sqrt(2), sinusoidal-current assumption
  peak_phase_current_arms: 40.3051  # DERIVED:57Apk/sqrt(2), sinusoidal-current assumption
  no_load_current_arms: 0.98
performance:
  rated_torque_nm: 11.0       # SPEC p31: at100rpm with200x200mm aluminum heat sink
  stall_continuous_torque_nm: 8.0 # SPEC p33: distinct stall-rated point
  continuous_torque_basis: "Published 8 Nm continuous stall rating; robot cooling unverified"
  peak_torque_nm: 36.0
  rated_speed_rpm: 100.0
  rated_speed_rad_s: 10.4719755
  no_load_speed_rpm: 480.0
  no_load_speed_rad_s: 50.2654825
  peak_torque_duration_s: 1.0 # conservative I2t budget; based on published stall peak duration
  # Published overload points do not define an identified transient thermal model.
  # The software I2t budget is not an exact reproduction of these curves.
  vendor_curve:
    source_pdf_pages: [31, 32, 33]
    heat_sink_dimensions_mm: [200, 200]
    heat_sink_basis: "Explicit for rotating tests; stall table does not restate all conditions"
    stall_peak_duration_s: 1.0
    rotating_peak_duration_s: 4.0
    rotating_overload_nm_s: [[17, 200], [20, 36], [25, 18], [30, 8], [36, 4]]
    stall_overload_nm_s: [[11, 200], [17, 15], [25, 5], [30, 1], [36, 1]]
    torque_speed_48v_nm_rpm: [[5, 430], [11, 426], [20, 390], [30, 320], [36, 280]]
thermal:
  # Uncalibrated illustrative copper-only model. R_th and C_th below are retained
  # engineering assumptions, NOT fitted to the new published overload curves.
  # The sourced resistance/Kt update does not validate temperature predictions.
  thermal_resistance_k_per_w: 1.31
  thermal_capacitance_j_per_k: 310.5
  time_constant_s: 406.755
  ambient_temp_c: 20.0
  calibrated: false
  basis: "Unmeasured thermal resistance/capacitance; equivalent-wye electrical inference; indicative only"
can:
  bitrate_bps: 1000000
  bits_per_frame_design: 150
  max_bus_load_fraction: 0.80
  recommended_control_rate_hz: 400
  recommended_bus_count: 2
  scaling:
    position_min_rad: -12.57 # vendor sample uses 12.57 for +/-4pi
    position_max_rad: 12.57
    velocity_min_rad_s: -50.0
    velocity_max_rad_s: 50.0
    torque_min_nm: -36.0
    torque_max_nm: 36.0
    kp_min: 0.0
    kp_max: 5000.0
    kd_min: 0.0
    kd_max: 100.0
    temperature_scale_c: 0.1
sensing:
  encoder_count: 2
  encoder_bits: 14
  output_resolution_rad: 0.0003834952
joint_dynamics:
  damping_nms_per_rad: 0.05  # ESTIMATE at motor output
  coulomb_friction_nm: 0.12  # ESTIMATE at motor output
  armature_kgm2: 0.012      # SPEC p31 output-equivalent inertia; knee reflects by2^2 to0.048
transmissions:
  haa: {ratio: 1.0, efficiency: 1.0}
  hfe: {ratio: 1.0, efficiency: 1.0}
  kfe: {ratio: 2.0, efficiency: 0.95} # requested 1:2 pulley reduction; efficiency assumed
operational_limits:
  continuous_torque_nm: 8.0 # conservative stall-rated baseline; 11Nm rotating rating is conditional
  peak_torque_nm: 36.0
  velocity_rad_s: 20.0
  position_margin_rad: 0.05
  temperature_warn_c: 70.0
  temperature_derate_c: 85.0
  temperature_fault_c: 100.0

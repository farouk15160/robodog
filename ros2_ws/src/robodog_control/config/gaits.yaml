# RS06 / 28.000 kg loaded test model / 192 + 195.621 mm links / 2:1 knee belt.
# Base configuration is 19.719271 kg; centered removable ballast is 8.280729 kg.
# Flat-ground simulation tuning, NOT a terrain or hardware qualification.
# The 40 mm lift reduces swing acceleration and motor load on the shorter legs.
# Walk at1.5Hz improves speed tracking and body tilt relative to the old1.2Hz.
# Trot at330mm leaves ~78mm extension reserve including the20mm foot radius.
# Reproduce with tools/torque_report.py; safety and configured gains stay active.
gaits:
  stand:
    step_frequency_hz: 0.0
    duty_factor: 1.0
    step_height_m: 0.0
    stance_height_m: 0.320
    description: All four feet planted; RS06 loaded standing configuration.
  walk:
    step_frequency_hz: 1.5
    duty_factor: 0.78
    step_height_m: 0.03
    stance_height_m: 0.320
    description: One foot swings at a time; reduced lift and longer support for RS06 stall limits at0.15m/s.
  trot:
    step_frequency_hz: 2.2
    duty_factor: 0.50
    step_height_m: 0.04
    stance_height_m: 0.330
    description: Diagonal pairs; tuned on flat ground at0.30 and0.50m/s.
  pace:
    step_frequency_hz: 2.0
    duty_factor: 0.50
    step_height_m: 0.06
    stance_height_m: 0.320
    description: Experimental lateral pairs; unvalidated for the new configuration.
  bound:
    step_frequency_hz: 2.6
    duty_factor: 0.45
    step_height_m: 0.08
    stance_height_m: 0.310
    description: Experimental front/rear pairs; unvalidated for the new configuration.
